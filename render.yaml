# render.yaml — Render Blueprint

services:
  # ── API ──────────────────────────────────────────────────────────────────
  - type: web
    name: traceops-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        fromDatabase:
          name: traceops-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: traceops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: traceops-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: traceops-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: traceops-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # ── Worker ───────────────────────────────────────────────────────────────
  - type: worker
    name: traceops-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery_app worker --beat --loglevel=info --concurrency=2
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: traceops-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: traceops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: traceops-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: traceops-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: traceops-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: traceops-api
          type: web
          envVarKey: SECRET_KEY
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # ── Redis ────────────────────────────────────────────────────────────────
  - type: redis
    name: traceops-redis
    plan: free
    ipAllowList: []   # ✅ REQUIRED FIX

databases:
  - name: traceops-db
    databaseName: traceops_db
    user: traceops_user
    plan: free
