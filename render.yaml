# render.yaml — Render Blueprint
# Defines all EAS services for one-click deployment
# https://render.com/docs/blueprint-spec

services:
  # ── API ──────────────────────────────────────────────────────────────────
  - type: web
    name: eas-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        fromDatabase:
          name: eas-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: eas-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: eas-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: eas-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: eas-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false   # set manually in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false

  # ── Worker + Beat (combined to save free slots) ──────────────────────────
  - type: worker
    name: eas-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery_app worker --beat --loglevel=info --concurrency=2
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eas-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: eas-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: eas-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: eas-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: eas-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: eas-api
          type: web
          envVarKey: SECRET_KEY
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: eas-db
    databaseName: eas_db
    user: eas_user
    plan: free

  - name: eas-redis
    plan: free
    ipAllowList: []
